name: Integration PF - Data Daemon (Staging)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to test. Leave empty to use the current branch."
        required: false
        type: string
        default: ""
      python-version:
        description: 'JSON array of Python versions. Trim entries to skip matrix rows.'
        required: false
        type: string
        default: '["3.10", "3.14"]'
      os:
        description: 'JSON array of runners. Trim entries to skip matrix rows.'
        required: false
        type: string
        default: '["ubuntu-24.04", "macos-26"]'

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: pre-commit/action@v3.0.1

  test:
    needs: pre-commit
    # Use the Rust data daemon for the staging integration suite. Exercise its
    # bundled native artefacts on each shipped OS (Linux x86_64, macOS arm64)
    # across the Python support range.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      # Dispatch inputs narrow the axes; the literals are the fallback for
      # scheduled runs, where the `inputs` context is empty and dispatch input
      # defaults do not apply.
      matrix:
        python-version: ${{ fromJSON(inputs.python-version || '["3.10", "3.14"]') }}
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "macos-26"]') }}

    steps:
    - name: Show disk space
      run: df -h /


    - name: Checkout test harness
      uses: NeuracoreAI/shared-workflows/actions/checkout-test-harness@main
      with:
        environment: staging
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up neuracore with Rust data daemon
      uses: NeuracoreAI/shared-workflows/actions/setup-neuracore-from-source@main
      with:
        checkout: "false"
        path: "."
        extras: dev

    - name: Disable timer coalescing (macOS)
      if: runner.os == 'macOS'
      run: sudo sysctl -w kern.timer.coalescing_enabled=0

    - name: Run Data Daemon Integration Tests
      env:
        NEURACORE_API_URL: https://staging.api.neuracore.com/api
        NEURACORE_API_KEY: ${{ secrets.STAGING_SERVICE_API_KEY }}
        NEURACORE_ORG_ID: ${{ vars.STAGING_SERVICE_ORG_ID }}
        NEURACORE_PROVIDE_LIVE_DATA: false

      # --import-mode=importlib keeps the repo root off sys.path. log_cli_format
      # namespaces live log lines by worker process so interleaved context output
      # stays attributable.
      run: >-
        pytest -o log_cli=true --log-cli-level=INFO
        -o "log_cli_format=%(levelname)-8s %(processName)-11s %(filename)s:%(lineno)s %(message)s"
        --import-mode=importlib
        tests/integration/platform/data_daemon/

    - name: Show disk space after tests
      if: always()
      run: df -h /
