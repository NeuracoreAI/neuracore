name: Cougar Tracing - Data Daemon (Staging)
run-name: "Cougar Tracing — macOS 300s stochastic capture (${{ github.ref_name }})"

# TEMPORARY tracing branch (ci/cougar-tracing-run). Do not merge to main.
#
# Captures evidence for the remaining macOS-only nightly failure: the 300s
# stochastic performance cases fail "fired at wrong moment" — a producer
# frame lands beyond the ±50ms tolerance because the producer thread's
# sleep wakes 20-170ms late in the first seconds of a case's first
# recording. Runs 30108050527/30109237047/30109801387/30110350339
# established that plain sleeps on these VM runners wake 30-160ms late
# as a baseline condition (hard per-config ceilings; immune to CPU
# warmth, latency QoS, daemon quieting, and a keep-awake spinner), so a
# ±50ms schedule assert over time.sleep cannot pass reliably. This
# revision compares wait primitives (cold/short/chunked/kqueue sentinels)
# to determine whether any of them beats the leeway, which decides
# between a harness wait rewrite and a macOS-specific tolerance.
# Evidence layers per leg:
#   producer: per-frame timing diagnostics (NEURACORE_PRODUCER_DIAGNOSTICS,
#     harness ported from test/300s-failure) in the pytest logs;
#   host: a sleep-jitter sentinel (50ms sleeper logging wakeup overshoot
#     for the whole job), 0.5s ps sampling, continuous `top` samples,
#     thermal notifications and best-effort powermetrics under
#     host-telemetry/;
#   daemon: debug-level daemon logs, continuous log streams and state.db
#     snapshots (RUST_LOG=debug rather than trace so the daemon's own
#     logging overhead does not perturb the scheduling behaviour under
#     test).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to test. Leave empty to use the current branch."
        required: false
        type: string
        default: ""
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      NCD_RUST_DAEMON: "1"
      NEURACORE_STOCHASTIC_BUSY_WAIT: "0"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.10']
        os: [macos-26, macos-26-xlarge]

    steps:
    - name: Show disk space
      run: df -h /

    - name: Checkout test harness
      uses: NeuracoreAI/shared-workflows/actions/checkout-test-harness@main
      with:
        environment: staging
        ref: ${{ inputs.ref }}

    - name: Start host telemetry
      shell: bash
      # Runs before setup so the sentinel and samplers cover the setup
      # phase's load spike as well as the tests.
      run: |
        set -euo pipefail
        mkdir -p tracing-artifacts/host-telemetry
        {
          date -u +"start_utc=%Y-%m-%dT%H:%M:%SZ epoch=%s"
          sw_vers
          uname -a
          sysctl hw.model hw.ncpu hw.memsize 2>/dev/null || true
          sysctl kern.timer 2>/dev/null || true
          mdutil -a -s 2>/dev/null || true
        } > tracing-artifacts/host-telemetry/host-info.txt
        ps aux > tracing-artifacts/host-telemetry/ps-at-start.txt
        # Sentinels: wait-primitive comparison, whole job, epoch-stamped.
        # Prior runs established plain 50ms sleeps wake 30-160ms late on
        # these VMs (hard per-config ceilings; immune to CPU warmth,
        # latency QoS, quieting, and a keep-awake spinner). These four
        # variants determine whether ANY wait primitive beats the leeway,
        # which decides the harness fix:
        # Run 30111198741 (xlarge): leeway scales with the requested
        # interval (50ms sleep => ~150ms ceiling, 5ms sleep => ~50ms
        # ceiling; 5ms-chunked 50ms target => p95 ~38ms), and the
        # NOTE_CRITICAL kqueue probe spun on immediate EV_ERROR returns.
        # This revision sizes the chunk and fixes the kqueue probe:
        #   cold   — plain 50ms time.sleep (control);
        #   chunk5 — 50ms absolute target via 5ms sleep chunks;
        #   chunk2 — 50ms absolute target via 2ms sleep chunks (predicted
        #            ~20ms ceiling => reliable under the ±50ms assert);
        #   kqueue — 50ms oneshot EVFILT_TIMER, plain NOTE_USECONDS,
        #            registration separated from the wait.
        cat > "${RUNNER_TEMP}/sleep_sentinel.py" <<'SENTINEL'
        import select
        import sys
        import time

        MODE = sys.argv[1]
        INTERVAL = 0.05
        CHUNKS = {"chunk5": 0.005, "chunk2": 0.002}
        REPORT_EVERY = 30.0
        NOTE_USECONDS = 0x2

        kq = select.kqueue() if MODE == "kqueue" else None

        def wait_once() -> float:
            """Wait one interval, return overshoot in ms."""
            if MODE in CHUNKS:
                chunk = CHUNKS[MODE]
                target = time.monotonic() + INTERVAL
                while True:
                    remaining = target - time.monotonic()
                    if remaining <= 0:
                        break
                    time.sleep(chunk if remaining > chunk else remaining)
                return (time.monotonic() - target) * 1000.0
            if MODE == "kqueue":
                event = select.kevent(
                    1,
                    select.KQ_FILTER_TIMER,
                    select.KQ_EV_ADD | select.KQ_EV_ONESHOT,
                    NOTE_USECONDS,
                    int(INTERVAL * 1e6),
                )
                start = time.monotonic()
                kq.control([event], 0, 0)
                fired = kq.control(None, 1, None)
                if fired and fired[0].flags & select.KQ_EV_ERROR:
                    print(f"kqueue error: {fired[0]}", flush=True)
                    sys.exit(1)
                return (time.monotonic() - start - INTERVAL) * 1000.0
            start = time.monotonic()
            time.sleep(INTERVAL)
            return (time.monotonic() - start - INTERVAL) * 1000.0

        samples = []
        last_report = time.monotonic()
        while True:
            overshoot_ms = wait_once()
            samples.append(overshoot_ms)
            if overshoot_ms > 10.0:
                print(f"{time.time():.3f} overshoot_ms={overshoot_ms:.1f}", flush=True)
            now = time.monotonic()
            if now - last_report >= REPORT_EVERY:
                samples.sort()
                count = len(samples)
                print(
                    f"{time.time():.3f} summary n={count}"
                    f" p50={samples[count // 2]:.1f}"
                    f" p95={samples[int(count * 0.95)]:.1f}"
                    f" max={samples[-1]:.1f}",
                    flush=True,
                )
                samples = []
                last_report = now
        SENTINEL
        for mode in cold chunk5 chunk2 kqueue; do
          nohup python3 -u "${RUNNER_TEMP}/sleep_sentinel.py" "${mode}" \
            > "tracing-artifacts/host-telemetry/sleep-sentinel-${mode}.log" 2>&1 &
        done
        # 0.5s process sampler: cputime deltas between ticks attribute
        # sub-second CPU bursts that top's 2s window averages away.
        cat > "${RUNNER_TEMP}/pssampler.sh" <<'PSS'
        #!/usr/bin/env bash
        set -u
        while true; do
          echo "== $(date -u +%s)"
          ps -Ao pid,pcpu,cputime,comm -r 2>/dev/null | head -12
          sleep 0.5
        done
        PSS
        chmod +x "${RUNNER_TEMP}/pssampler.sh"
        nohup "${RUNNER_TEMP}/pssampler.sh" \
          > tracing-artifacts/host-telemetry/ps-sample.log 2>&1 &
        echo $! > "${RUNNER_TEMP}/pssampler.pid"
        # Whole-host CPU attribution. `top` logging mode timestamps every
        # sample; correlate against the producer diagnostics' epoch
        # timestamps in the pytest log.
        nohup top -l 0 -s 2 -n 20 -o cpu \
          -stats pid,command,cpu,th,csw,state,time \
          > tracing-artifacts/host-telemetry/top-stream.log 2>&1 &
        echo $! > "${RUNNER_TEMP}/top.pid"
        nohup pmset -g thermlog \
          > tracing-artifacts/host-telemetry/thermlog.log 2>&1 &
        echo $! > "${RUNNER_TEMP}/thermlog.pid"
        # Best-effort: not available inside some macOS runner VMs.
        sudo nohup powermetrics -i 5000 --samplers cpu_power,thermal,tasks \
          > tracing-artifacts/host-telemetry/powermetrics.log 2>&1 &

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up neuracore with Rust data daemon
      uses: NeuracoreAI/shared-workflows/actions/setup-neuracore-from-source@main
      with:
        checkout: "false"
        path: "."
        extras: dev

    - name: Start state snapshotter
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p tracing-artifacts/snapshots
        cat > "${RUNNER_TEMP}/snapshotter.sh" <<'SNAP'
        #!/usr/bin/env bash
        # Continuous capture so daemon evidence is never lost:
        #  - logstreams/: one `tail -F` per discovered daemon.log — survives
        #    truncation and per-test daemon restarts, so the full log history
        #    always exists even though the harness reuses/wipes the file.
        #  - dblatest/ + dbarchive/: every state.db is backed up each tick;
        #    when a db path disappears (harness cleanup) its last copy is
        #    moved to dbarchive/ permanently.
        #  - snapshots/: 10s point-in-time ring (last 40) for state evolution.
        set -u
        roots=(".data_daemon_test_state" "${HOME}/.neuracore/data_daemon")
        base="tracing-artifacts"
        mkdir -p "${base}/logstreams" "${base}/dblatest" "${base}/dbarchive" \
          "${base}/snapshots" "${base}/.watch"
        while true; do
          ts="$(date +%Y%m%d_%H%M%S)"
          out="${base}/snapshots/${ts}"
          mkdir -p "${out}"
          for root in "${roots[@]}"; do
            [ -d "${root}" ] || continue
            while IFS= read -r lg; do
              key="cap_$(echo "${lg}" | tr '/ ' '__')"
              if [ ! -e "${base}/.watch/log_${key}" ]; then
                printf '%s\n' "${lg}" > "${base}/.watch/log_${key}"
                nohup tail -n +1 -F "${lg}" \
                  >> "${base}/logstreams/${key}" 2>/dev/null &
              fi
              cp "${lg}" "${out}/${key}" 2>/dev/null || true
            done < <(find "${root}" -name 'daemon.log' 2>/dev/null)
            while IFS= read -r db; do
              key="cap_$(echo "${db}" | tr '/ ' '__')"
              printf '%s\n' "${db}" > "${base}/.watch/db_${key}"
              sqlite3 "${db}" ".backup '${base}/dblatest/${key}'" 2>/dev/null \
                || cp "${db}" "${base}/dblatest/${key}" 2>/dev/null || true
              cp "${base}/dblatest/${key}" "${out}/${key}" 2>/dev/null || true
            done < <(find "${root}" -name 'state.db' 2>/dev/null)
          done
          for marker in "${base}"/.watch/db_cap_*; do
            [ -e "${marker}" ] || continue
            src="$(cat "${marker}")"
            key="$(basename "${marker}")"; key="${key#db_}"
            if [ ! -e "${src}" ] && [ -e "${base}/dblatest/${key}" ]; then
              mv "${base}/dblatest/${key}" "${base}/dbarchive/${key}.${ts}" \
                2>/dev/null || true
              rm -f "${marker}"
            fi
          done
          { df -h /; echo; ps aux | grep -Ei 'data-daemon|neuracore|pytest|ffmpeg' | grep -v grep; } \
            > "${out}/system.txt" 2>/dev/null || true
          ls -1dt "${base}"/snapshots/*/ 2>/dev/null | tail -n +41 \
            | while IFS= read -r old; do rm -rf "${old}"; done
          sleep 10
        done
        SNAP
        chmod +x "${RUNNER_TEMP}/snapshotter.sh"
        nohup "${RUNNER_TEMP}/snapshotter.sh" > tracing-artifacts/snapshotter.log 2>&1 &
        echo "$!" > "${RUNNER_TEMP}/snapshotter.pid"
        echo "snapshotter pid $(cat "${RUNNER_TEMP}/snapshotter.pid")"

    - name: Run macOS 300s stochastic cases (trace capture)
      # Three ~300s cases per pass; a fully green pass captures nothing, so
      # retry up to 3 passes and stop at the first failing one. Bounded well
      # under the 6h default so a wedge cannot burn the budget and the
      # artifact upload still runs; faulthandler dumps stacks first.
      timeout-minutes: 240
      env:
        NEURACORE_API_URL: https://staging.api.neuracore.com/api
        NEURACORE_API_KEY: ${{ secrets.STAGING_SERVICE_API_KEY }}
        NEURACORE_ORG_ID: ${{ vars.STAGING_SERVICE_ORG_ID }}
        NEURACORE_PROVIDE_LIVE_DATA: false
        NEURACORE_PRODUCER_DIAGNOSTICS: "1"
        RUST_LOG: "data_daemon=debug,data_daemon_bridge=debug,data_daemon_shared=debug,data_daemon_ipc=debug,info"
        NDD_DEBUG: "true"
        PYTHONFAULTHANDLER: "1"
      # --import-mode=importlib keeps the repo root off sys.path. log_cli_format
      # namespaces live log lines by worker process so interleaved context
      # output stays attributable.
      shell: bash
      run: |
        set -uo pipefail
        mkdir -p tracing-artifacts
        nodes=(
          'tests/integration/platform/data_daemon/performance/test_pre_network.py::test_disk_db_write_performance[300s-16recs-variable-2ctx-seq-10joints-15hz-1cam-1920x1080-15hz-stochastic]'
          'tests/integration/platform/data_daemon/performance/test_network.py::test_cloud_upload_and_readiness_performance[300s-16recs-variable-2ctx-seq-10joints-15hz-1cam-1920x1080-15hz-stochastic]'
          'tests/integration/platform/data_daemon/performance/test_network.py::test_cloud_upload_and_readiness_performance[300s-16recs-variable-2ctx-seq-10joints-15hz-1cam-1920x1080-15hz-stochastic-wait]'
        )
        rc=0
        for attempt in 1 2 3; do
          echo "=== attempt ${attempt} $(date -u +"%Y-%m-%dT%H:%M:%SZ epoch=%s") ==="
          pytest -o log_cli=true --log-cli-level=INFO \
            -o "log_cli_format=%(levelname)-8s %(processName)-11s %(filename)s:%(lineno)s %(message)s" \
            -o faulthandler_timeout=900 \
            --import-mode=importlib \
            "${nodes[@]}" \
            2>&1 | tee "tracing-artifacts/pytest-daemon-attempt${attempt}.log"
          rc="${PIPESTATUS[0]}"
          if [ "${rc}" -ne 0 ]; then
            break
          fi
        done
        exit "${rc}"

    - name: Collect final daemon state
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        mkdir -p tracing-artifacts/final
        for root in ".data_daemon_test_state" "${HOME}/.neuracore/data_daemon"; do
          [ -d "${root}" ] || continue
          find "${root}" \( -name 'daemon.log' -o -name 'state.db' -o -name 'state.db-*' -o -name '*.csv' \) \
            -exec sh -c 'cp "$2" "$1/cap_$(echo "$2" | tr "/ " "__")" 2>/dev/null || true' _ "tracing-artifacts/final" {} \; || true
          du -ak "${root}" 2>/dev/null | sort -rn > "tracing-artifacts/final/manifest_$(echo "${root}" | tr '/ ' '__').txt" || true
        done

    - name: Stop capture and compress log streams
      if: always()
      # The snapshotter, tail followers and telemetry samplers must be dead
      # before upload-artifact zips the directory — files mutating mid-zip
      # make the upload fail with "error creating zip".
      run: |
        kill "$(cat "${RUNNER_TEMP}/snapshotter.pid" 2>/dev/null)" 2>/dev/null || true
        kill "$(cat "${RUNNER_TEMP}/top.pid" 2>/dev/null)" 2>/dev/null || true
        kill "$(cat "${RUNNER_TEMP}/thermlog.pid" 2>/dev/null)" 2>/dev/null || true
        pkill -f sleep_sentinel.py 2>/dev/null || true
        kill "$(cat "${RUNNER_TEMP}/pssampler.pid" 2>/dev/null)" 2>/dev/null || true
        sudo pkill -x powermetrics 2>/dev/null || true
        pkill -f 'tail.*daemon.log' 2>/dev/null || true
        sleep 2
        gzip -f tracing-artifacts/logstreams/* 2>/dev/null || true
        gzip -f tracing-artifacts/host-telemetry/top-stream.log \
          tracing-artifacts/host-telemetry/powermetrics.log \
          tracing-artifacts/host-telemetry/ps-sample.log 2>/dev/null || true

    - name: Upload tracing artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cougar-tracing-daemon-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          tracing-artifacts/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 7

    - name: Show disk space after tests
      if: always()
      run: df -h /
