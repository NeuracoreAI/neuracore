name: Integration PF - Data Daemon (Production)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to test. Leave empty to use the latest release tag."
        required: false
        type: string
        default: ""
      python-version:
        description: 'JSON array of Python versions. Trim entries to skip matrix rows.'
        required: false
        type: string
        default: '["3.10", "3.14"]'
      os:
        description: 'JSON array of runners. Trim entries to skip matrix rows.'
        required: false
        type: string
        default: '["ubuntu-24.04", "macos-26"]'

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: pre-commit/action@v3.0.1

  functional:
    needs: pre-commit
    # Exercise the released wheel's bundled Rust daemon on each shipped OS
    # (Linux x86_64, macOS arm64) across the Python support range.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      # Dispatch inputs narrow the axes; the literals are the fallback for
      # scheduled runs, where the `inputs` context is empty and dispatch input
      # defaults do not apply.
      matrix:
        python-version: ${{ fromJSON(inputs.python-version || '["3.10", "3.14"]') }}
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "macos-26"]') }}

    steps:
    - name: Show disk space
      run: df -h /


    - name: Checkout test harness
      id: harness
      uses: NeuracoreAI/shared-workflows/actions/checkout-test-harness@main
      with:
        environment: production
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up neuracore with Rust data daemon from PyPI
      uses: NeuracoreAI/shared-workflows/actions/setup-neuracore-from-pypi@main
      with:
        version: ${{ steps.harness.outputs.release-tag }}
        extras: dev

    - name: Run Data Daemon Functional Tests
      env:
        NEURACORE_API_URL: https://api.neuracore.com/api
        NEURACORE_API_KEY: ${{ secrets.PROD_SERVICE_API_KEY }}
        NEURACORE_ORG_ID: ${{ vars.PROD_SERVICE_ORG_ID }}
        NEURACORE_PROVIDE_LIVE_DATA: false

      # --import-mode=importlib keeps the repo root off sys.path. Without it
      # pytest prepends it (tests/ is a package up to the root) and `import
      # neuracore` resolves to the checked-out source instead of the installed
      # wheel — where the bundled daemon binary is gitignored, so the daemon
      # would be unreachable.
      run: >-
        pytest -o log_cli=true --log-cli-level=INFO
        --import-mode=importlib
        tests/integration/platform/data_daemon/behavioural_correctness/
        tests/integration/platform/data_daemon/data_integrity/

    - name: Show disk space after tests
      run: df -h /

  performance:
    # Runs after `functional` has drained, one matrix row at a time. The performance
    # suite asserts wall-clock deadlines, and overlapping rows contend for both
    # the runner pool and the shared backend, which makes those deadlines flaky.
    needs: [pre-commit, functional]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      # Run the performance suite on a single matrix row to limit wasted actions runner time.
      matrix:
        python-version: ${{ fromJSON(inputs.python-version || '["3.14"]') }}
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04"]') }}

    steps:
    - name: Show disk space
      run: df -h /

    - name: Checkout test harness
      id: harness
      uses: NeuracoreAI/shared-workflows/actions/checkout-test-harness@main
      with:
        environment: production
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up neuracore with Rust data daemon from PyPI
      uses: NeuracoreAI/shared-workflows/actions/setup-neuracore-from-pypi@main
      with:
        version: ${{ steps.harness.outputs.release-tag }}
        extras: dev

    - name: Run Data Daemon Performance Tests
      env:
        NEURACORE_API_URL: https://api.neuracore.com/api
        NEURACORE_API_KEY: ${{ secrets.PROD_SERVICE_API_KEY }}
        NEURACORE_ORG_ID: ${{ vars.PROD_SERVICE_ORG_ID }}
        NEURACORE_PROVIDE_LIVE_DATA: false

      # --import-mode=importlib keeps the repo root off sys.path. Without it
      # pytest prepends it (tests/ is a package up to the root) and `import
      # neuracore` resolves to the checked-out source instead of the installed
      # wheel — where the bundled daemon binary is gitignored, so the daemon
      # would be unreachable.
      run: >-
        pytest -o log_cli=true --log-cli-level=INFO
        --import-mode=importlib
        tests/integration/platform/data_daemon/performance/

    - name: Show disk space after tests
      run: df -h /
