# Each top-level entry is one training job. Optional ``evaluations`` lists every
# way that checkpoint is scored; Phase 2 runs them all in one pytest case and
# only deletes the training job when every variant meets its threshold.
#
# Evaluation modes:
#   omit / endpoint     — remote endpoint + open-loop chunking (default)
#   realtime_chunking   — in-process RTC (diffusion / flow only)
#   temporal_ensemble   — in-process async temporal-ensemble merge. Optional
#                         ``num_inference_steps`` overrides the sampler step
#                         count for models that have one; needed for diffusion,
#                         whose offline default of 100 cannot finish inside a
#                         control tick. Omit it for ACT / CNNMLP.
algorithms:
  - name: CNNMLP
    algorithm_config:
      batch_size: 64
      epochs: 50
      output_prediction_horizon: 100
      lr: 1.4e-4
      lr_backbone: 1.4e-5
    evaluations:
      - min_success_rate: 0.2
      - mode: temporal_ensemble
        min_success_rate: 0.2
        control_hz: 50
        execution_horizon: 1
        m: 0.01

  - name: ACT
    algorithm_config:
      batch_size: 64
      epochs: 50
      output_prediction_horizon: 100
      lr: 1.4e-4
      lr_backbone: 1.4e-5
    evaluations:
      - min_success_rate: 0.5
      - mode: temporal_ensemble
        min_success_rate: 0.5
        control_hz: 50
        execution_horizon: 1
        m: 0.01

  - name: DiffusionPolicy
    algorithm_config:
      batch_size: 64
      epochs: 40
      output_prediction_horizon: 64
      lr: 2.0e-4
      lr_backbone: 2.0e-4
    evaluations:
      - min_success_rate: 0.4
      - mode: realtime_chunking
        min_success_rate: 0.4
        control_hz: 20
        inference_delay: 8
        execution_horizon: 16
        adapt_inference_delay: true

  - name: Pi0
    min_success_rate: 0.0
    algorithm_config:
      batch_size: 2
      epochs: 1
      output_prediction_horizon: 64
      optimizer_lr: 2.0e-4
      paligemma_variant: gemma_tiny
      action_expert_variant: gemma_tiny
      use_pretrained_weights: false
      num_inference_steps: 1
      vlm_max_text_tokens: 4
      compile_model: false
      gradient_checkpointing: true
      dtype: bfloat16

  - name: Pi05
    min_success_rate: 0.0
    algorithm_config:
      batch_size: 2
      epochs: 1
      output_prediction_horizon: 64
      optimizer_lr: 2.0e-4
      paligemma_variant: gemma_tiny
      action_expert_variant: gemma_tiny
      use_pretrained_weights: false
      num_inference_steps: 1
      vlm_max_text_tokens: 4
      compile_model: false
      gradient_checkpointing: true
      dtype: bfloat16
      discrete_state_input: true

  - name: Groot
    min_success_rate: 0.0
    algorithm_config:
      batch_size: 2
      epochs: 1
      output_prediction_horizon: 64
      lr: 1.0e-4
      use_pretrained_weights: false
      use_tiny_vlm: true
      num_denoising_steps: 1
      num_dit_layers: 2
      num_attention_heads: 2
      attention_head_dim: 16
      dit_output_dim: 32
      backbone_embedding_dim: 64
      gradient_checkpointing: true
      use_torch_compile: false
