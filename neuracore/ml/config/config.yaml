defaults:
  - _self_
  - optional user: null
  - algorithm: null
  - override hydra/launcher: basic

training_name:
training_name_auto_increment: false
training_id: null

org_id: null

# Only one of the below needs to be provided.
dataset_name:
dataset_id:

# Only one of the below needs to be provided.
algorithm_name:
algorithm_id:

algorithm_params: null

# Core training parameters
seed: 42
epochs: 100
output_prediction_horizon: 100
validation_split: 0.2
frequency: 10
allow_duplicates: true

# Resume training
resume_checkpoint_path: null  # Path to checkpoint to resume from

logging_frequency: 50
# Frequency (in steps) for weight/gradient histograms. A histogram of every
# parameter and every gradient is orders of magnitude more expensive than the
# scalars logged at logging_frequency, so it is off by default. Only supported
# by the local TensorBoard logger.
histogram_logging_frequency: 0
# Every epoch ends with a timing summary. The per-section breakdown (dataloader
# wait / host-to-device / forward / backward / optimizer / logging) needs a
# device barrier to be meaningful, so it is sampled every N iterations rather
# than measured on all of them. 0 reports total iteration times only.
timing_sample_interval: 25
keep_last_n_checkpoints: 2
device: null  # e.g., "cuda:0", "mps", "cpu"

input_data_types:
output_data_types:

input_cross_embodiment_description: {

}
output_cross_embodiment_description: {

}

# Batch size (can be "auto" for automatic tuning or an integer)
batch_size: "auto"
# Autotune results are cached on disk against the model, its input shapes, and
# the GPU. Set to true to re-probe instead of reusing a cached result.
force_batch_size_autotune: false
# Whether an explicitly specified batch size is probed for a GPU memory fit.
# Skipped automatically when a cached autotune result already covers it.
validate_batch_size: true

num_train_workers: 8
num_val_workers: 4
# Batches each worker loads ahead of the training loop.
prefetch_factor: 4

# Maximum number of workers to use for prefetching recordings. The prefetch is
# wget + ffmpeg subprocesses, so it is IO-bound rather than CPU-bound and
# benefits from more workers than there are cores.
max_prefetch_workers: 16

max_delay_s: null
trim_start_end: true

# If set, drop frames at the start of each episode while every joint position
# stays within this threshold of its value in the first frame.
trim_no_movement_at_start_threshold: null

# Dict[str, Dict[DataType, List[MethodConfig]]], e.g.:
# for images, we must have a resize step to reshape all images from different sources to the same size.
# train_preprocessing is used on the training split (may include augmentations).
# inference_preprocessing is used for validation and packaged into the model archive.
train_preprocessing:
  input:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
      - _target_: neuracore.ml.preprocessing.methods.color_jitter.ColorJitter
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      - _target_: neuracore.ml.preprocessing.methods.gaussian_noise.GaussianNoise
        std: 5.0
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
  output:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]

inference_preprocessing:
  input:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
  output:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]

# Resolve the name separately from the full path so Hydra can still own
# hydra.run.dir creation while Neuracore controls duplicate-name behavior.
_resolved_training_name: ${resolve_training_run_name:${training_name},${training_name_auto_increment}}
local_output_dir: ${oc.env:HOME}/.neuracore/training/runs/${_resolved_training_name}

# Hydra configuration
hydra:
  run:
    dir: ${local_output_dir}
  sweep:
    dir: ${local_output_dir}
    subdir: ${hydra:job.num}
