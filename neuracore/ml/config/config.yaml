defaults:
  - _self_
  - optional user: null
  - algorithm: null
  - override hydra/launcher: basic

training_name:
training_name_auto_increment: false
training_id: null

org_id: null

# Only one of the below needs to be provided.
dataset_name:
dataset_id:

# Only one of the below needs to be provided.
algorithm_name:
algorithm_id:

algorithm_params: null

# Core training parameters
seed: 42
epochs: 100
output_prediction_horizon: 100
# Consecutive observations, ending at the current step, that each input spans.
# 1 supplies only the current observation, which is what every built-in
# algorithm uses. Raising it costs a frame decode per extra step.
input_observation_horizon: 1
validation_split: 0.2
frequency: 10
allow_duplicates: true

# Resume training
resume_checkpoint_path: null  # Path to checkpoint to resume from

logging_frequency: 50
# Frequency (in steps) for host and accelerator utilisation under system/.
# Sampled far less often than the model metrics: each sample costs syscalls and
# an NVML query, and utilisation moves slowly enough that a fine cadence buys
# nothing. 0 disables it.
system_logging_frequency: 200
keep_last_n_checkpoints: 2
device: null  # e.g., "cuda:0", "mps", "cpu"

input_data_types:
output_data_types:

input_cross_embodiment_description: {

}
output_cross_embodiment_description: {

}

# Batch size (can be "auto" for automatic tuning or an integer)
batch_size: "auto"

# Cache fully built training samples under ~/.neuracore/training/sample_cache,
# keyed by a hash of everything that changes what a sample contains. Skips
# frame decode and tensor construction on every epoch after the first, and on
# any later run of the same configuration. Disable to always rebuild.
dataset_sample_cache: true

num_train_workers: 4
num_val_workers: 2

# Threads the prefetch uses to decode videos with ffmpeg. Downloading does not
# use these threads.
max_prefetch_workers: 4

# Network requests the prefetch keeps outstanding at once, all from a single
# thread. Raise this, rather than max_prefetch_workers, to make the prefetch
# faster; throughput flattens out beyond ~16.
prefetch_inflight_requests: 16

max_delay_s: null
trim_start_end: true

# If set, drop frames at the start of each episode while every joint position
# stays within this threshold of its value in the first frame.
trim_no_movement_at_start_threshold: null

# Dict[str, Dict[DataType, List[MethodConfig]]], e.g.:
# for images, we must have a resize step to reshape all images from different sources to the same size.
# train_preprocessing is used on the training split (may include augmentations).
# inference_preprocessing is used for validation and packaged into the model archive.
#
# ORDERING: methods do not necessarily run in the order listed here. Each method
# declares, via its `on_cpu` attribute, whether it runs per sample in a
# DataLoader worker or per batch once the batch is on the training device, and
# every worker-side method runs before every device-side one. Relative order is
# preserved within each of those two groups.
train_preprocessing:
  input:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
      - _target_: neuracore.ml.preprocessing.methods.color_jitter.ColorJitter
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      - _target_: neuracore.ml.preprocessing.methods.gaussian_noise.GaussianNoise
        std: 5.0
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
  output:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]

inference_preprocessing:
  input:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
  output:
    RGB_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]
    DEPTH_IMAGES:
      - _target_: neuracore.ml.preprocessing.methods.resize_pad.ResizePad
        size: [224, 224]

# Resolve the name separately from the full path so Hydra can still own
# hydra.run.dir creation while Neuracore controls duplicate-name behavior.
_resolved_training_name: ${resolve_training_run_name:${training_name},${training_name_auto_increment}}
local_output_dir: ${oc.env:HOME}/.neuracore/training/runs/${_resolved_training_name}

# Hydra configuration
hydra:
  run:
    dir: ${local_output_dir}
  sweep:
    dir: ${local_output_dir}
    subdir: ${hydra:job.num}
