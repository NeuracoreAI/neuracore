defaults:
  - _self_
  - optional user: null
  - algorithm: null
  - override hydra/launcher: basic

training_name:
training_name_auto_increment: false
training_id: null

org_id: null

# Only one of the below needs to be provided.
dataset_name:
dataset_id:

# Only one of the below needs to be provided.
algorithm_name:
algorithm_id:

algorithm_params: null

# Core training parameters
seed: 42
epochs: 100
output_prediction_horizon: 100
validation_split: 0.2
# How many validation episodes to roll out and save. 0 disables rollout
# saving. Metric validation still covers every validation sample.
validation_rollout_episodes: 5
# Write rollout snapshots when epoch % validation_rollout_frequency == 0.
# 0 disables rollout saving.
validation_rollout_frequency: 5
frequency: 10
allow_duplicates: true

# Resume training
resume_checkpoint_path: null  # Path to checkpoint to resume from

logging_frequency: 50
# Frequency (in steps) for host and accelerator utilisation under system/.
# Sampled far less often than the model metrics: each sample costs syscalls and
# an NVML query, and utilisation moves slowly enough that a fine cadence buys
# nothing. 0 disables it.
system_logging_frequency: 200
keep_last_n_checkpoints: 2
# Retain checkpoints whose epoch is divisible by this.
checkpoint_saving_frequency: 5
device: null  # e.g., "cuda:0", "mps", "cpu"

input_data_types:
output_data_types:

input_cross_embodiment_description: {

}
output_cross_embodiment_description: {

}

# Batch size (can be "auto" for automatic tuning or an integer)
batch_size: "auto"

# Cache fully built training samples under ~/.neuracore/training/sample_cache,
# keyed by a hash of everything that changes what a sample contains. Skips
# frame decode and tensor construction on every epoch after the first, and on
# any later run of the same configuration. Disable to always rebuild.
dataset_sample_cache: true

num_train_workers: 4
num_val_workers: 2

# Threads the prefetch uses to decode videos with ffmpeg. Downloading does not
# use these threads.
max_prefetch_decode_workers: 4

# Network requests the prefetch keeps outstanding at once, all from a single
# thread. Raise this, rather than max_prefetch_decode_workers, to make the prefetch
# faster; throughput flattens out beyond ~16.
num_concurrent_prefetch_requests: 16

max_delay_s: null
trim_start_end: true

# If set, drop frames at the start of each episode while every joint position
# stays within this threshold of its value in the first frame.
trim_no_movement_at_start_threshold: null

# Dict[role, Dict[DataType, Dict[group, List[step]]]].
# train_preprocessing is used on the training split (may include augmentations).
# inference_preprocessing is used for validation and packaged into the model archive.
# Images need a resize step so frames from different sources share one size.
#
# Each data type holds two ordered step lists. geometric steps run per sample in
# DataLoader workers and may change the image shape. photometric steps run per
# batch on the training device and keep the shape. Every geometric step runs
# before every photometric step, and each list runs in the order written.
# Each step is a one-key mapping from the method name to its parameters.
# Methods: resize_pad (geometric), color_jitter and gaussian_noise (photometric).
train_preprocessing:
  input:
    RGB_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric:
        - color_jitter:
            brightness: 0.2
            contrast: 0.2
            saturation: 0.2
            hue: 0.05
        - gaussian_noise:
            std: 5.0
    DEPTH_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []
  output:
    RGB_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []
    DEPTH_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []

inference_preprocessing:
  input:
    RGB_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []
    DEPTH_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []
  output:
    RGB_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []
    DEPTH_IMAGES:
      geometric:
        - resize_pad:
            size: [224, 224]
      photometric: []

# Resolve the name separately from the full path so Hydra can still own
# hydra.run.dir creation while Neuracore controls duplicate-name behavior.
_resolved_training_name: ${resolve_training_run_name:${training_name},${training_name_auto_increment}}
local_output_dir: ${oc.env:HOME}/.neuracore/training/runs/${_resolved_training_name}

# Hydra configuration
hydra:
  run:
    dir: ${local_output_dir}
  sweep:
    dir: ${local_output_dir}
    subdir: ${hydra:job.num}
